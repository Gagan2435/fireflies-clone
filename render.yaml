# Render blueprint for the API. Deploy the frontend separately (Vercel/Netlify, root: frontend).
services:
  - type: web
    name: fireflies-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: CORS_ORIGINS
        value: "*"            # replace with your frontend URL once deployed
